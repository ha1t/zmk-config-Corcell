CONFIG_I2C=y
CONFIG_INPUT_LENOTP=y

# Diagnostics live here rather than in corcell_r.conf so the product build
# stays clean. USB logging and the shells keep the USB stack running, which
# wrecks any power measurement and is not something to ship.
CONFIG_ZMK_USB_LOGGING=y
# The driver registers as LOG_MODULE_REGISTER(lenotp, CONFIG_INPUT_LOG_LEVEL),
# so its per-report "buttons=.. x=.. y=.." line needs debug level.
CONFIG_INPUT_LOG_LEVEL_DBG=y
# "i2c scan i2c@40004000" answers whether a module is alive and at which
# address. "gpio get gpio@50000300 12" watches INT without touching I2C.
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
